# HTTPS config for drmis.info (based on nginx-https.conf.example)
# Certs: /etc/letsencrypt/live/drmis.info (Let's Encrypt, webroot renewal via /var/www/certbot)

# HTTP: serve ACME challenges, redirect everything else to HTTPS
server {
    listen 80;
    server_name drmis.info www.drmis.info;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://drmis.info$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.drmis.info;
    ssl_certificate /etc/letsencrypt/live/drmis.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drmis.info/privkey.pem;
    return 301 https://drmis.info$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name drmis.info;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/drmis.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drmis.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 500m;

    # 1. Proxy TiTiler
    location ^~ /titiler/ {
        proxy_pass http://titiler:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # 2. Proxy API and admin to Django
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-token-auth/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Static/Media
    location /static/ {
        alias /static/;
    }

    location /media/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }

    # 4. Frontend SPA
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
