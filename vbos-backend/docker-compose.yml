services:
  postgres:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=vbos
    image: postgis/postgis:17-3.5
    platform: linux/x86_64
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
  web:
    working_dir: /code
    restart: always
    environment:
      - DJANGO_CONFIGURATION=Local
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_AWS_ACCESS_KEY_ID=${DJANGO_AWS_ACCESS_KEY_ID}
      - DJANGO_AWS_SECRET_ACCESS_KEY=${DJANGO_AWS_SECRET_ACCESS_KEY}
      - DJANGO_AWS_STORAGE_BUCKET_NAME=${DJANGO_AWS_STORAGE_BUCKET_NAME}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=vbos
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    build: ./
    command: >
      bash -c "python3 wait_for_postgres.py &&
               ./manage.py migrate &&
               ./manage.py collectstatic --noinput &&
               ./manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/code
    ports:
      - "8080:8000"  # 8080 to avoid conflict with VM deploy web (8000)
    depends_on:
      - postgres
  documentation:
    restart: always
    build: ./
    command: "python3 -m mkdocs serve"
    volumes:
      - ./:/code
    ports:
      - "8001:8001"
  titiler:
    build: ./titiler-local
    platform: linux/amd64
    environment:
      WEB_CONCURRENCY: 1
    ports:
      - "8003:8000"  # 8003 to avoid conflict with VM deploy titiler (8002)
    volumes:
      - ./raster_data:/data
    restart: unless-stopped
